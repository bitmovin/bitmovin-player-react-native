name: Setup project environment
description: Setup the project environment

inputs:
  node:
    description: Setup node and install root node modules
    default: false
    required: false
  node-version:
    description: Node.js version to use when setting up node
    default: '24'
    required: false
  subprojects:
    description: Setup node and install root and subproject node modules (overrides `node` input)
    default: false
    required: false
  brew:
    description: Setup Homebrew
    default: false
    required: false
  ios:
    description: Setup xcode and install dependencies (overrides `brew` input)
    default: false
    required: false
  java:
    description: Setup Java and Gradle cache
    default: false
    required: false
  tv:
    description: Prebuild TV projects
    default: false
    required: false
  skip-prebuild:
    description: Skip smart prebuild steps (useful when restoring from cache first)
    default: false
    required: false

runs:
  using: composite
  steps:
    - name: Set up Java
      if: ${{ inputs.java == 'true' }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle cache
      if: ${{ inputs.java == 'true' }}
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/development' }}

    - name: Setup node and npm registry
      if: ${{ inputs.node == 'true' || inputs.subprojects == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs['node-version'] }}
        check-latest: true
        registry-url: 'https://registry.npmjs.org/'
        cache: 'yarn'

    # Cached native projects keep the absolute Node path from the run that generated them,
    # and pod install never rewrites an existing .xcode.env.local
    - name: Point cached iOS projects at the current Node binary
      if: ${{ inputs.ios == 'true' && (inputs.node == 'true' || inputs.subprojects == 'true') }}
      shell: bash
      run: |
        for project in example/ios integration_test/ios; do
          if [ -d "$project" ]; then
            echo "export NODE_BINARY=$(command -v node)" > "$project/.xcode.env.local"
          fi
        done

    - name: Install node_modules
      if: ${{ inputs.node == 'true' || inputs.subprojects == 'true' }}
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Install node_modules (example/)
      if: ${{ inputs.subprojects == 'true' }}
      shell: bash
      run: |
        yarn install --cwd example
        cp example/.env.example example/.env

    - name: Generate native projects for mobile platforms
      if: ${{ inputs.subprojects == 'true' && inputs.tv == 'false' && inputs['skip-prebuild'] != 'true' }}
      shell: bash
      run: |
        .github/scripts/smart-prebuild.sh example
      env:
        NSUnbufferedIO: YES

    - name: Generate native projects for TV platforms
      if: ${{ inputs.subprojects == 'true' && inputs.tv == 'true' && inputs['skip-prebuild'] != 'true' }}
      shell: bash
      run: |
        .github/scripts/smart-prebuild.sh example tv
      env:
        NSUnbufferedIO: YES

    - name: Install node_modules (integration_test/)
      if: ${{ inputs.subprojects == 'true' }}
      shell: bash
      run: |
        yarn install --cwd integration_test
        cp integration_test/.env.example integration_test/.env
        if [ "${{ inputs['skip-prebuild'] }}" != "true" ]; then
          .github/scripts/smart-prebuild.sh integration-test
        fi
      env:
        NSUnbufferedIO: YES

    - name: Setup Gradle CI properties
      if: ${{ inputs.java == 'true' && inputs.subprojects == 'true' }}
      shell: bash
      run: |
        .github/scripts/setup-gradle-properties.sh

    - uses: maxim-lobanov/setup-xcode@v1
      if: ${{ inputs.ios == 'true' }}
      with:
        xcode-version: '26.6' # Includes the Swift 6.3.3 compiler.

    - name: Show Apple toolchain versions
      if: ${{ inputs.ios == 'true' }}
      shell: bash
      run: |
        xcodebuild -version
        xcrun swift --version

    - name: Install dependencies
      if: ${{ inputs.ios == 'true' || inputs.brew == 'true' }}
      shell: bash
      run: brew bundle install
