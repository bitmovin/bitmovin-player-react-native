name: Finish Release Train

run-name: Finish release train on ${{ github.ref_name }}

on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - support/v0

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

concurrency:
  group: finish-release-train-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    name: Prepare Release
    outputs:
      version_number: ${{ steps.version_number.outputs.version_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Git User
        run: |
          # setup git
          git config --global user.name "Bitmovin Release Automation"
          git config --global user.email "support@bitmovin.com"

      - name: Detect version number
        id: version_number
        run: |
          version_number="$(jq --raw-output '.version' package.json)"
          echo "Detected version number: $version_number"
          echo "version_number=$version_number" >> $GITHUB_OUTPUT

      - name: Update Changelog
        run: |
          sed -i "s/\[${{ steps.version_number.outputs.version_number }}\].*/\[${{ steps.version_number.outputs.version_number }}\] - $(date +'%Y-%m-%d')/g" CHANGELOG.md

      - name: Commit changelog version bump
        run: |
          git add CHANGELOG.md
          git commit --no-verify -m "bump changelog date to today"
          git push origin ${{ github.ref }}

  create_pr:
    needs: [prepare]
    name: Create Finish Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Git User
        run: |
          git config --global user.name "Bitmovin Release Automation"
          git config --global user.email "support@bitmovin.com"

      - name: Set sync branch
        id: sync
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" = "support/v0" ]; then
            target_base="development-v0"
          else
            target_base="development"
          fi

          branch_name="finish-release/v${{ needs.prepare.outputs.version_number }}-sync-${target_base}"
          echo "target_base=$target_base" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create sync branch
        run: |
          git checkout -B "${{ steps.sync.outputs.branch_name }}"
          python3 .github/scripts/ensure_unreleased_changelog.py

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains an Unreleased section"
          else
            git add CHANGELOG.md
            git commit --no-verify -m "restore unreleased changelog section"
          fi

          if git ls-remote --exit-code --heads origin "${{ steps.sync.outputs.branch_name }}" >/dev/null; then
            git fetch origin "${{ steps.sync.outputs.branch_name }}:refs/remotes/origin/${{ steps.sync.outputs.branch_name }}"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "Sync branch does not exist yet"
            else
              exit "$status"
            fi
          fi
          git push --force-with-lease origin "${{ steps.sync.outputs.branch_name }}"

      - name: Create PR
        run: |
          existing_pr_number="$(gh pr list \
            --state open \
            --head "${{ steps.sync.outputs.branch_name }}" \
            --base "${{ steps.sync.outputs.target_base }}" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_pr_number" ]; then
            gh pr edit "$existing_pr_number" \
              --title "Finish release ${{ needs.prepare.outputs.version_number }}" \
              --body "Finish release ${{ needs.prepare.outputs.version_number }}"
          else
            gh pr create \
              --base "${{ steps.sync.outputs.target_base }}" \
              --head "${{ steps.sync.outputs.branch_name }}" \
              --title "Finish release ${{ needs.prepare.outputs.version_number }}" \
              --body "Finish release ${{ needs.prepare.outputs.version_number }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish_release:
    needs: [prepare, create_pr]
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Git User
        run: |
          # setup git
          git config --global user.name "Bitmovin Release Automation"
          git config --global user.email "support@bitmovin.com"

      - name: Add tag
        run: |
          git tag v${{ needs.prepare.outputs.version_number }}

      - name: Git push
        run: |
          git push origin v${{ needs.prepare.outputs.version_number }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true

      - name: Build TypeScript files
        run: yarn build

      - name: Publish npm package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog
        id: changelog
        uses: ffurrer2/extract-release-notes@v3

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.prepare.outputs.version_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.changelog.outputs.release_notes }}

  publish_documentation:
    needs: [publish_release]
    name: Generate API Documentation
    uses: ./.github/workflows/generate-documentation.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GCS_ACCOUNT: ${{ secrets.GCS_ACCOUNT }}
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
      CF_ZONEID: ${{ secrets.CF_ZONEID }}
