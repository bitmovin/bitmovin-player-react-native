name: CI (Android)

on:
  pull_request:
    paths:
      - '.github/workflows/ci-android.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'plugin/**'
      - 'android/**'
      - 'example/android/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/android/**'
      - 'integration_test/scripts/build-android.sh'
      - 'integration_test/package.json'
      - 'integration_test/yarn.lock'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/*.gradle*'
      - '**/gradle.properties'
      - '**/gradle-wrapper.properties'
      - '**/gradle/**'
      - '**/gradlew*'

  push:
    branches:
      - development
    paths:
      - '.github/workflows/ci-android.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'plugin/**'
      - 'android/**'
      - 'example/android/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/android/**'
      - 'integration_test/scripts/build-android.sh'
      - 'integration_test/package.json'
      - 'integration_test/yarn.lock'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/*.gradle*'
      - '**/gradle.properties'
      - '**/gradle-wrapper.properties'
      - '**/gradle/**'
      - '**/gradlew*'

concurrency:
  group: ci-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci

jobs:
  code-style-android:
    name: Code style Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true

      - name: Check code style
        run: yarn lint:android

  test-build-android:
    name: Build Android Example App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true
          node: true
          subprojects: true
          skip-prebuild: true

      - name: Prebuild Android Example
        run: yarn example prebuild --clean --platform android

      - name: Build Android example
        id: build
        run: |
          START_TIME=$(date +%s)
          cd example/android
          ./gradlew assembleDebug --quiet --console=plain \
            --build-cache --parallel --max-workers=4 --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures=x86,x86_64
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Report build time
        run: echo "✅ Build completed in ${{ steps.build.outputs.duration }} seconds"

  test-build-android-integration-tests:
    name: Build Android Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true
          node: true
          subprojects: true
          skip-prebuild: true

      - name: Prebuild Android Integration
        run: yarn integration-test prebuild --clean --platform android

      - name: Build Android integration test host app
        id: build
        run: |
          START_TIME=$(date +%s)
          cd integration_test/android
          ./gradlew assembleDebug --quiet --console=plain \
            --build-cache --parallel --max-workers=4 --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures=x86,x86_64
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Report build time
        run: echo "✅ Build completed in ${{ steps.build.outputs.duration }} seconds"

  test-build-android-tv:
    name: Build Android TV Example App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true
          node: true
          subprojects: true
          tv: true
          skip-prebuild: true

      - name: Prebuild Android TV Example
        run: yarn example prebuild:tv --clean --platform android

      - name: Build Android TV example
        id: build
        run: |
          START_TIME=$(date +%s)
          cd example/android
          ./gradlew assembleDebug --quiet --console=plain \
            --build-cache --parallel --max-workers=4 --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures=x86,x86_64
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Report build time
        run: echo "✅ Build completed in ${{ steps.build.outputs.duration }} seconds"
