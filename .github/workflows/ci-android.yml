name: CI (Android)

on:
  pull_request:
    paths:
      - '.github/workflows/ci-android.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'plugin/**'
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'expo-module.config.json'
      - 'app.plugin.js'
      - 'android/**'
      - 'example/android/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/**'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/*.gradle*'
      - '**/gradle.properties'
      - '**/gradle-wrapper.properties'
      - '**/gradle/**'
      - '**/gradlew*'

  push:
    branches:
      - development
    paths:
      - '.github/workflows/ci-android.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'plugin/**'
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'expo-module.config.json'
      - 'app.plugin.js'
      - 'android/**'
      - 'example/android/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/**'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/*.gradle*'
      - '**/gradle.properties'
      - '**/gradle-wrapper.properties'
      - '**/gradle/**'
      - '**/gradlew*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci

jobs:
  code-style-android:
    name: Code style Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true

      - name: Check code style
        run: yarn lint:android

  test-build-android:
    if: github.event_name != 'workflow_dispatch'
    name: Build Android Example App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true
          node: true
          subprojects: true
          skip-prebuild: true

      - name: Prebuild Android Example
        run: yarn example prebuild --clean --platform android

      - name: Build Android example
        id: build
        run: |
          START_TIME=$(date +%s)
          cd example/android
          ./gradlew assembleDebug --quiet --console=plain \
            --build-cache --parallel --max-workers=4 --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures=x86,x86_64
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Report build time
        run: echo "✅ Build completed in ${{ steps.build.outputs.duration }} seconds"

  test-build-android-integration-tests:
    name: Build and test Android integration host
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_SERIAL: emulator-5554
      CAVY_ANDROID_APK: ${{ github.workspace }}/integration_test/android/app/build/outputs/apk/debug/app-debug.apk
      CAVY_ARTIFACTS_DIR: ${{ github.workspace }}/integration_test/artifacts/android-system-tests
      CAVY_TIMEOUT_MS: '1800000'
      RCT_METRO_PORT: '8081'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check integration test license
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          EXPO_PUBLIC_BITMOVIN_PLAYER_LICENSE_KEY: ${{ secrets.INTEGRATION_TESTS_PLAYER_LICENSE_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_BITMOVIN_PLAYER_LICENSE_KEY" ]; then
            echo "::error::Configure INTEGRATION_TESTS_PLAYER_LICENSE_KEY to run Android integration tests."
            exit 1
          fi

      - name: Explain fork integration test policy
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        run: echo "Android host build and launcher tests run for fork PRs. Integration execution requires a trusted branch with the player license secret." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true
          node: true
          subprojects: true
          skip-prebuild: true

      - name: Check integration test runners
        timeout-minutes: 5
        run: yarn integration-test check:runner

      - name: Prebuild Android Integration
        timeout-minutes: 5
        env:
          # Forks retain build coverage using the same placeholder as .env.example.
          EXPO_PUBLIC_BITMOVIN_PLAYER_LICENSE_KEY: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && secrets.INTEGRATION_TESTS_PLAYER_LICENSE_KEY || 'YOUR_LICENSE_KEY_HERE' }}
        run: yarn integration-test prebuild --clean --platform android

      - name: Build Android integration test host app once
        timeout-minutes: 25
        working-directory: integration_test/android
        run: |
          ./gradlew assembleDebug --quiet --console=plain \
            --build-cache --parallel --max-workers=4 --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run all Android integration tests
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPO_PUBLIC_BITMOVIN_PLAYER_LICENSE_KEY: ${{ secrets.INTEGRATION_TESTS_PLAYER_LICENSE_KEY }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: cavy-ci
          cores: 2
          emulator-port: 5554
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: |
            mkdir -p "$CAVY_ARTIFACTS_DIR"
            cp "$ANDROID_HOME/emulator/source.properties" "$CAVY_ARTIFACTS_DIR/emulator-version.txt"
            cp "${ANDROID_AVD_HOME:-$HOME/.android/avd}/cavy-ci.avd/config.ini" "$CAVY_ARTIFACTS_DIR/emulator-config.ini"
            adb -s "$ANDROID_SERIAL" shell getprop ro.build.fingerprint > "$CAVY_ARTIFACTS_DIR/system-image.txt"
            cd integration_test && node scripts/run-ci-tests.js android

      - name: Upload Android integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-system-tests-${{ github.run_attempt }}
          path: |
            integration_test/artifacts/android-system-tests/
            integration_test/cavy_results.xml
            integration_test/cavy_results.md
          if-no-files-found: warn
          retention-days: 7

  test-build-android-tv:
    if: github.event_name != 'workflow_dispatch'
    name: Build Android TV Example App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java: true
          node: true
          subprojects: true
          tv: true
          skip-prebuild: true

      - name: Prebuild Android TV Example
        run: yarn example prebuild:tv --clean --platform android

      - name: Build Android TV example
        id: build
        run: |
          START_TIME=$(date +%s)
          cd example/android
          ./gradlew assembleDebug --quiet --console=plain \
            --build-cache --parallel --max-workers=4 --no-daemon \
            --no-configuration-cache \
            -PreactNativeArchitectures=x86,x86_64
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Report build time
        run: echo "✅ Build completed in ${{ steps.build.outputs.duration }} seconds"
