name: Expo Auto Doctor

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: expo-auto-doctor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-open-pr:
    name: Preserve open Expo update PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Look up open update PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --state open --base development --head feature/expo-install-fix \
            --json number --jq '.[0].number // empty')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          if [[ -n "$pr_number" ]]; then
            echo "Leaving open PR #$pr_number unchanged for review"
          fi

  nightly-fix-pr:
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.number == '' }}
    name: Nightly Expo Fix PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_BRANCH: development
      BOT_BRANCH: feature/expo-install-fix
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            example/yarn.lock
            integration_test/yarn.lock

      - name: Setup git user
        run: |
          git config --global user.name "Expo Update Bot"
          git config --global user.email "expo-update-bot@bitmovin.com"

      - name: Reset branch from latest development
        run: |
          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BOT_BRANCH" "origin/$BASE_BRANCH"

      - name: Prepare env files for app workspaces
        run: |
          cp example/.env.example example/.env
          cp integration_test/.env.example integration_test/.env

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn install --frozen-lockfile --cwd example
          yarn install --frozen-lockfile --cwd integration_test

      - name: Apply expo install --fix in all workspaces
        run: |
          EXPO_NONINTERACTIVE=1 yarn expo install --fix
          (
            cd example
            EXPO_NONINTERACTIVE=1 yarn expo install --fix
          )
          (
            cd integration_test
            EXPO_NONINTERACTIVE=1 yarn expo install --fix
          )

      - name: Validate with expo-doctor in all workspaces
        run: |
          EXPO_NONINTERACTIVE=1 npx --yes expo-doctor@latest
          (
            cd example
            EXPO_NONINTERACTIVE=1 npx --yes expo-doctor@latest
          )
          (
            cd integration_test
            EXPO_NONINTERACTIVE=1 npx --yes expo-doctor@latest
          )

      - name: Update Expo changelog entry
        run: |
          if ! git diff --quiet -- package.json yarn.lock example/package.json example/yarn.lock integration_test/package.json integration_test/yarn.lock; then
            python3 .github/scripts/update_expo_changelog.py
          fi

      - name: Check for tracked changes
        id: changed
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lookup existing PR
        id: pr
        run: |
          pr_number="$(gh pr list \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$BOT_BRANCH" \
            --json number \
            --jq '.[0].number')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Commit dependency updates
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: |
          git add -u
          git commit -m 'Align Expo dependencies with compatible patch releases'

      - name: Push branch
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: git push --force-with-lease origin "$BOT_BRANCH"

      - name: Create or update draft PR
        if: ${{ steps.changed.outputs.has_changes == 'true' || steps.pr.outputs.number != '' }}
        run: |
          pr_number="${{ steps.pr.outputs.number }}"
          pr_title="Nightly Expo dependency alignment"
          pr_body=$'Automated nightly run:\n\n- reset branch from latest `development`\n- run `expo install --fix` in `./`, `example`, and `integration_test`\n- verify all three with `expo-doctor`\n- leave this PR unchanged until it is merged or closed\n\nPlease review dependency and lockfile updates before merging.'
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BOT_BRANCH" \
              --title "$pr_title" \
              --body "$pr_body" \
              --draft
          else
            gh pr edit "$pr_number" --title "$pr_title" --body "$pr_body"
          fi

      - name: Run CI for the bot update
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: |
          for workflow in ci-typescript.yml ci-android.yml ci-ios-tvos.yml expo-doctor.yml; do
            gh workflow run "$workflow" --ref "$BOT_BRANCH"
          done
