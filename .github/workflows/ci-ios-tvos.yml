name: CI (iOS & tvOS)

on:
  push:
    branches:
      - development
    paths:
      - 'ios/**'
      - 'plugin/**'
      - 'example/ios/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/ios/**'
      - 'integration_test/package.json'
      - 'integration_test/yarn.lock'
      - 'package.json'
      - 'yarn.lock'
      - '**/Podfile*'
      - '**/*.podspec'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - '**/Info.plist'
      - '.github/workflows/ci-ios-tvos.yml'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/build-ios.sh'
      - '**/build-tvos.sh'
      - 'example/scripts/**'
      - 'integration_test/scripts/**'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ios/**'
      - 'plugin/**'
      - 'example/ios/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/ios/**'
      - 'integration_test/package.json'
      - 'integration_test/yarn.lock'
      - 'package.json'
      - 'yarn.lock'
      - '**/Podfile*'
      - '**/*.podspec'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - '**/Info.plist'
      - '.github/workflows/ci-ios-tvos.yml'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/build-ios.sh'
      - '**/build-tvos.sh'
      - 'example/scripts/**'
      - 'integration_test/scripts/**'

concurrency:
  group: ci-ios-tvos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NSUnbufferedIO: YES
  IOS_DESTINATION: 'generic/platform=iOS Simulator'
  TVOS_DESTINATION: 'generic/platform=tvOS Simulator'
  XCODEBUILD_COMMON_FLAGS: '-parallelizeTargets -jobs 4 ONLY_ACTIVE_ARCH=YES ARCHS=x86_64 VALID_ARCHS=x86_64 DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=NO SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=NO GCC_OPTIMIZATION_LEVEL=0 SWIFT_OPTIMIZATION_LEVEL=-Onone ENABLE_BITCODE=NO'

jobs:
  code-style-ios:
    name: Code style iOS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: ios --strict

  ios-example-build:
    name: Build iOS Example App
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache iOS Example Prebuild
        id: ios-example-prebuild-cache
        uses: actions/cache@v6
        with:
          path: |
            example/ios
          key: ${{ runner.os }}-ios-example-prebuild-${{ hashFiles('example/yarn.lock', 'example/app.config.*', 'plugin/**', 'ios/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-example-prebuild-

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true
          subprojects: true
          ios: true
          skip-prebuild: true

      - name: Build config plugin
        if: ${{ steps.ios-example-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn build:plugin

      - name: Configure iOS Example
        if: ${{ steps.ios-example-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn example prebuild --platform ios --no-install

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: ${{ runner.os }}-ios-example-pods-${{ hashFiles('ios/dependencies.json', 'ios/RNBitmovinPlayer.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-example-pods-

      - name: Install CocoaPods Dependencies
        run: yarn example pods

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace example/ios/BitmovinPlayerReactNativeExample.xcworkspace -scheme BitmovinPlayerReactNativeExample

      - name: Save resolved Swift package versions
        uses: actions/upload-artifact@v4
        with:
          name: ios-example-swift-packages
          path: example/ios/BitmovinPlayerReactNativeExample.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build iOS Example App
        id: build
        run: |
          START_TIME=$(date +%s)
          yarn example build:ios --renderer github-actions
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "✅ Build completed in $((END_TIME - START_TIME)) seconds"
        env:
          XCODEBUILD_ARGS: "-destination '${{ env.IOS_DESTINATION }}' ${{ env.XCODEBUILD_COMMON_FLAGS }} -derivedDataPath ${{ runner.temp }}/bitmovin-build"

      - name: Verify embedded SDK frameworks
        env:
          APP_PATH: ${{ runner.temp }}/bitmovin-build/Build/Products/Debug-iphonesimulator/BitmovinPlayerReactNativeExample.app
        run: |
          for framework in BitmovinPlayer BitmovinPlayerCore BitmovinPlayerAnalytics BitmovinCollector GoogleInteractiveMediaAds; do
            binary="$APP_PATH/Frameworks/$framework.framework/$framework"
            if [ ! -s "$binary" ]; then
              echo "::error::Missing embedded SDK binary: $binary"
              exit 1
            fi
          done

  ios-integration-build:
    name: Build iOS Integration Tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache iOS Integration Prebuild
        id: ios-integration-prebuild-cache
        uses: actions/cache@v6
        with:
          path: |
            integration_test/ios
          key: ${{ runner.os }}-ios-integration-prebuild-${{ hashFiles('integration_test/yarn.lock', 'integration_test/app.config.*', 'plugin/**', 'ios/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-integration-prebuild-

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true
          subprojects: true
          ios: true
          skip-prebuild: true

      - name: Build config plugin
        if: ${{ steps.ios-integration-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn build:plugin

      - name: Configure iOS Integration
        if: ${{ steps.ios-integration-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn integration-test prebuild --platform ios --no-install

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            integration_test/ios/Pods
          key: ${{ runner.os }}-ios-integration-pods-${{ hashFiles('ios/dependencies.json', 'ios/RNBitmovinPlayer.podspec', 'integration_test/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-integration-pods-

      - name: Install CocoaPods Dependencies
        run: yarn integration-test pods

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace integration_test/ios/IntegrationTest.xcworkspace -scheme IntegrationTest

      - name: Build iOS Integration Tests
        id: build
        run: |
          START_TIME=$(date +%s)
          yarn integration-test build:ios --renderer github-actions
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "✅ Build completed in $((END_TIME - START_TIME)) seconds"
        env:
          XCODEBUILD_ARGS: "-destination '${{ env.IOS_DESTINATION }}' ${{ env.XCODEBUILD_COMMON_FLAGS }}"

  tvos-example-build:
    name: Build tvOS Example App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache tvOS Prebuild
        id: tvos-prebuild-cache
        uses: actions/cache@v6
        with:
          path: |
            example/ios
          key: ${{ runner.os }}-tvos-prebuild-${{ hashFiles('example/yarn.lock', 'example/app.config.*', 'plugin/**', 'ios/**') }}
          restore-keys: |
            ${{ runner.os }}-tvos-prebuild-

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true
          subprojects: true
          ios: true
          tv: true
          skip-prebuild: true

      - name: Build config plugin
        if: ${{ steps.tvos-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn build:plugin

      - name: Configure tvOS Example
        if: ${{ steps.tvos-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn example prebuild:tv --platform ios --no-install

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: ${{ runner.os }}-tvos-pods-${{ hashFiles('ios/dependencies.json', 'ios/RNBitmovinPlayer.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-tvos-pods-

      - name: Install CocoaPods Dependencies
        run: yarn example pods

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace example/ios/BitmovinPlayerReactNativeExample.xcworkspace -scheme BitmovinPlayerReactNativeExample

      - name: Save resolved Swift package versions
        uses: actions/upload-artifact@v4
        with:
          name: tvos-example-swift-packages
          path: example/ios/BitmovinPlayerReactNativeExample.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build tvOS Example App
        id: build
        run: |
          START_TIME=$(date +%s)
          yarn example build:tvos --renderer github-actions
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "✅ Build completed in $((END_TIME - START_TIME)) seconds"
        env:
          XCODEBUILD_ARGS: "-destination '${{ env.TVOS_DESTINATION }}' ${{ env.XCODEBUILD_COMMON_FLAGS }} -derivedDataPath ${{ runner.temp }}/bitmovin-build"

      - name: Verify embedded SDK frameworks
        env:
          APP_PATH: ${{ runner.temp }}/bitmovin-build/Build/Products/Debug-appletvsimulator/BitmovinPlayerReactNativeExample.app
        run: |
          for framework in BitmovinPlayer BitmovinPlayerCore BitmovinPlayerAnalytics BitmovinCollector GoogleInteractiveMediaAds; do
            binary="$APP_PATH/Frameworks/$framework.framework/$framework"
            if [ ! -s "$binary" ]; then
              echo "::error::Missing embedded SDK binary: $binary"
              exit 1
            fi
          done
