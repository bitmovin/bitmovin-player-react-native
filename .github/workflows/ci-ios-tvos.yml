name: CI (iOS & tvOS)

on:
  workflow_dispatch:

  push:
    branches:
      - development
    paths:
      - 'ios/**'
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'app.plugin.js'
      - 'integration_test/**'
      - 'patches/**'
      - 'expo-module.config.json'
      - 'plugin/**'
      - 'example/ios/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/ios/**'
      - 'integration_test/package.json'
      - 'integration_test/yarn.lock'
      - 'package.json'
      - 'yarn.lock'
      - '**/Podfile*'
      - '**/*.podspec'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - '**/Info.plist'
      - '.github/workflows/ci-ios-tvos.yml'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/build-ios.sh'
      - '**/build-tvos.sh'
      - 'example/scripts/**'
      - 'integration_test/scripts/**'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'app.plugin.js'
      - 'integration_test/**'
      - 'patches/**'
      - 'expo-module.config.json'
      - 'plugin/**'
      - 'example/ios/**'
      - 'example/package.json'
      - 'example/yarn.lock'
      - 'integration_test/ios/**'
      - 'integration_test/package.json'
      - 'integration_test/yarn.lock'
      - 'package.json'
      - 'yarn.lock'
      - '**/Podfile*'
      - '**/*.podspec'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - '**/Info.plist'
      - '.github/workflows/ci-ios-tvos.yml'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '**/app.config.*'
      - '**/expo.json'
      - '**/build-ios.sh'
      - '**/build-tvos.sh'
      - 'example/scripts/**'
      - 'integration_test/scripts/**'

permissions:
  contents: read

concurrency:
  group: ci-ios-tvos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NSUnbufferedIO: YES
  IOS_DESTINATION: 'generic/platform=iOS Simulator'
  TVOS_DESTINATION: 'generic/platform=tvOS Simulator'
  XCODEBUILD_COMMON_FLAGS: '-parallelizeTargets -jobs 4 ONLY_ACTIVE_ARCH=YES ARCHS=x86_64 VALID_ARCHS=x86_64 DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=NO SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=NO GCC_OPTIMIZATION_LEVEL=0 SWIFT_OPTIMIZATION_LEVEL=-Onone ENABLE_BITCODE=NO'

jobs:
  code-style-ios:
    name: Code style iOS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: ios --strict

  ios-example-build:
    if: github.event_name != 'workflow_dispatch'
    name: Build iOS Example App
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache iOS Example Prebuild
        id: ios-example-prebuild-cache
        uses: actions/cache@v6
        with:
          path: |
            example/ios
          key: ${{ runner.os }}-ios-example-prebuild-${{ hashFiles('example/yarn.lock', 'example/app.config.*', 'plugin/**', 'ios/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-example-prebuild-

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true
          subprojects: true
          ios: true
          skip-prebuild: true

      - name: Build config plugin
        if: ${{ steps.ios-example-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn build:plugin

      - name: Configure iOS Example
        if: ${{ steps.ios-example-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn example prebuild --platform ios --no-install

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: ${{ runner.os }}-ios-example-pods-${{ hashFiles('ios/dependencies.json', 'ios/RNBitmovinPlayer.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-example-pods-

      - name: Install CocoaPods Dependencies
        run: yarn example pods

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace example/ios/BitmovinPlayerReactNativeExample.xcworkspace -scheme BitmovinPlayerReactNativeExample

      - name: Save resolved Swift package versions
        uses: actions/upload-artifact@v7
        with:
          name: ios-example-swift-packages
          path: example/ios/BitmovinPlayerReactNativeExample.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build iOS Example App
        id: build
        run: |
          START_TIME=$(date +%s)
          yarn example build:ios --renderer github-actions
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "✅ Build completed in $((END_TIME - START_TIME)) seconds"
        env:
          XCODEBUILD_ARGS: "-destination '${{ env.IOS_DESTINATION }}' ${{ env.XCODEBUILD_COMMON_FLAGS }} -derivedDataPath ${{ runner.temp }}/bitmovin-build"

      - name: Verify embedded SDK frameworks
        env:
          APP_PATH: ${{ runner.temp }}/bitmovin-build/Build/Products/Debug-iphonesimulator/BitmovinPlayerReactNativeExample.app
        run: |
          for framework in BitmovinPlayer BitmovinPlayerCore BitmovinPlayerAnalytics BitmovinCollector GoogleInteractiveMediaAds; do
            binary="$APP_PATH/Frameworks/$framework.framework/$framework"
            if [ ! -s "$binary" ]; then
              echo "::error::Missing embedded SDK binary: $binary"
              exit 1
            fi
          done

  ios-integration-build:
    name: Build iOS Integration Tests
    runs-on: macos-26
    timeout-minutes: 25
    env:
      BITMOVIN_ENABLE_GOOGLE_IMA: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache iOS Integration Prebuild
        id: ios-integration-prebuild-cache
        uses: actions/cache@v6
        with:
          path: |
            integration_test/ios
          key: ${{ runner.os }}-ios-integration-prebuild-google-ima-disabled-${{ hashFiles('integration_test/yarn.lock', 'integration_test/app.config.*', 'plugin/**', 'ios/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-integration-prebuild-

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true
          subprojects: true
          ios: true
          skip-prebuild: true

      - name: Build config plugin
        if: ${{ steps.ios-integration-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn build:plugin

      - name: Configure iOS Integration
        if: ${{ steps.ios-integration-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn integration-test prebuild --platform ios --no-install

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            integration_test/ios/Pods
          key: ${{ runner.os }}-ios-integration-pods-google-ima-disabled-${{ hashFiles('ios/dependencies.json', 'ios/RNBitmovinPlayer.podspec', 'integration_test/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-integration-pods-

      - name: Install CocoaPods Dependencies
        run: yarn integration-test pods

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace integration_test/ios/IntegrationTest.xcworkspace -scheme IntegrationTest

      - name: Build iOS Integration Tests
        id: build
        run: |
          START_TIME=$(date +%s)
          yarn integration-test build:ios --renderer github-actions
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "✅ Build completed in $((END_TIME - START_TIME)) seconds"
        env:
          XCODEBUILD_ARGS: "-destination '${{ env.IOS_DESTINATION }}' ${{ env.XCODEBUILD_COMMON_FLAGS }} -derivedDataPath ${{ runner.temp }}/bitmovin-integration-build"

      - name: Verify Google IMA package and framework are absent
        env:
          APP_PATH: ${{ runner.temp }}/bitmovin-integration-build/Build/Products/Debug-iphonesimulator/IntegrationTest.app
        run: |
          PLAYER_BINARY="$APP_PATH/Frameworks/BitmovinPlayer.framework/BitmovinPlayer"
          if [ ! -s "$PLAYER_BINARY" ]; then
            echo "::error::Missing embedded Player binary: $PLAYER_BINARY"
            exit 1
          fi
          PROJECT_FILE=integration_test/ios/IntegrationTest.xcodeproj/project.pbxproj
          PACKAGE_RESOLVED=integration_test/ios/IntegrationTest.xcworkspace/xcshareddata/swiftpm/Package.resolved
          for file in "$PROJECT_FILE" "$PACKAGE_RESOLVED"; do
            if [ -f "$file" ] && grep -q -E 'swift-package-manager-google-interactive-media-ads|GoogleInteractiveMediaAds' "$file"; then
              echo "::error::Unexpected Google IMA package reference in $file"
              exit 1
            fi
          done
          if [ -e "$APP_PATH/Frameworks/GoogleInteractiveMediaAds.framework" ]; then
            echo "::error::Unexpected Google IMA framework in the iOS integration app"
            exit 1
          fi

  ios-system-tests:
    name: Run iOS simulator integration suites
    runs-on: macos-26
    timeout-minutes: 75
    env:
      BITMOVIN_ENABLE_GOOGLE_IMA: 'true'
      IOS_SMOKE_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      IOS_SMOKE_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set iOS integration artifact paths
        run: |
          echo "IOS_SMOKE_APP_PATH=$RUNNER_TEMP/integration-host/Build/Products/Debug-iphonesimulator/IntegrationTest.app" >> "$GITHUB_ENV"
          echo "CAVY_ARTIFACTS_DIR=$RUNNER_TEMP/ios-cavy" >> "$GITHUB_ENV"

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true
          node-version: '22'
          subprojects: true
          ios: true
          skip-prebuild: true

      - name: Check iOS CI launcher failure handling
        run: node --test integration_test/scripts/ios-ci-launcher.test.js

      - name: Build config plugin
        run: yarn build:plugin

      - name: Configure iOS Integration
        run: yarn integration-test prebuild --clean --platform ios --no-install

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            integration_test/ios/Pods
          key: ${{ runner.os }}-ios-integration-arm64-pods-google-ima-enabled-v1-${{ hashFiles('ios/dependencies.json', 'ios/RNBitmovinPlayer.podspec', 'integration_test/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-integration-arm64-pods-google-ima-enabled-v1-

      - name: Install CocoaPods Dependencies
        run: yarn integration-test pods

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace integration_test/ios/IntegrationTest.xcworkspace -scheme IntegrationTest

      - name: Build iOS Integration Tests
        id: build
        run: |
          mkdir -p "$CAVY_ARTIFACTS_DIR"
          set -o pipefail
          yarn integration-test build:ios --renderer github-actions 2>&1 | tee "$CAVY_ARTIFACTS_DIR/build.log"
        env:
          # macos-26 is arm64. Keep this Debug product and install it below;
          # Cavy must never invoke a second React Native build.
          XCODEBUILD_ARGS: "-destination 'generic/platform=iOS Simulator' -derivedDataPath ${{ runner.temp }}/integration-host ONLY_ACTIVE_ARCH=YES ARCHS=arm64 VALID_ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO"

      - name: Run all iOS simulator integration tests
        id: cavy
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        timeout-minutes: 35
        working-directory: integration_test
        env:
          CI: 'true'
          EXPO_PUBLIC_BITMOVIN_PLAYER_LICENSE_KEY: ${{ secrets.INTEGRATION_TESTS_PLAYER_LICENSE_KEY }}
          CAVY_TIMEOUT_MS: '1800000'
        run: |
          test -n "$EXPO_PUBLIC_BITMOVIN_PLAYER_LICENSE_KEY" || { echo '::error::INTEGRATION_TESTS_PLAYER_LICENSE_KEY is required for iOS integration tests'; exit 1; }
          # The shared runner owns Metro, the test entry, Cavy reports and their
          # failure/zero-test checks. This adapter only installs and launches.
          # Simulator FairPlay and TV are excluded, never counted as passing.
          node scripts/run-ci-tests.js ios

      - name: Explain unavailable integration test credentials
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        run: echo '::notice::iOS host build only. Integration execution is skipped for fork and Dependabot PRs because no license secret is exposed.'

      - name: Save iOS integration diagnostics
        id: cavy_artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-cavy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAVY_ARTIFACTS_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize Cavy results
        if: always()
        timeout-minutes: 1
        env:
          CAVY_SUMMARY_PLATFORM: ios
          CAVY_SUMMARY_OS: ${{ env.IOS_SMOKE_RUNTIME }}
          CAVY_SUMMARY_DEVICE: ${{ env.IOS_SMOKE_DEVICE_TYPE }}
          CAVY_SUMMARY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CAVY_SUMMARY_TEST_OUTCOME: ${{ steps.cavy.outcome }}
          CAVY_SUMMARY_JOB_STATUS: ${{ job.status }}
          CAVY_SUMMARY_RUN_ALLOWED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
          CAVY_SUMMARY_ARTIFACT_NAME: ios-cavy-${{ github.run_id }}-${{ github.run_attempt }}
          CAVY_SUMMARY_ARTIFACT_URL: ${{ steps.cavy_artifacts.outputs.artifact-url }}
          CAVY_SUMMARY_ARTIFACT_OUTCOME: ${{ steps.cavy_artifacts.outcome }}
        run: python3 .github/scripts/cavy_summary.py

  tvos-example-build:
    if: github.event_name != 'workflow_dispatch'
    name: Build tvOS Example App
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: with Google IMA
            google-ima: 'true'
          - variant: without Google IMA
            google-ima: 'false'
    env:
      BITMOVIN_ENABLE_GOOGLE_IMA: ${{ matrix.google-ima }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache tvOS Prebuild
        id: tvos-prebuild-cache
        uses: actions/cache@v6
        with:
          path: |
            example/ios
          key: ${{ runner.os }}-tvos-prebuild-${{ matrix.google-ima }}-${{ hashFiles('example/yarn.lock', 'example/app.config.*', 'plugin/**', 'ios/**') }}
          restore-keys: |
            ${{ runner.os }}-tvos-prebuild-

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node: true
          subprojects: true
          ios: true
          tv: true
          skip-prebuild: true

      - name: Build config plugin
        if: ${{ steps.tvos-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn build:plugin

      - name: Configure tvOS Example
        if: ${{ steps.tvos-prebuild-cache.outputs.cache-hit != 'true' }}
        run: yarn example prebuild:tv --platform ios --no-install

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: ${{ runner.os }}-tvos-pods-${{ matrix.google-ima }}-${{ hashFiles('ios/dependencies.json', 'ios/RNBitmovinPlayer.podspec', 'example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-tvos-pods-

      - name: Install CocoaPods Dependencies
        run: yarn example pods

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace example/ios/BitmovinPlayerReactNativeExample.xcworkspace -scheme BitmovinPlayerReactNativeExample

      - name: Save resolved Swift package versions
        uses: actions/upload-artifact@v7
        with:
          name: tvos-example-swift-packages-${{ matrix.google-ima }}
          path: example/ios/BitmovinPlayerReactNativeExample.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build tvOS Example App
        id: build
        run: |
          START_TIME=$(date +%s)
          yarn example build:tvos --renderer github-actions
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "✅ Build completed in $((END_TIME - START_TIME)) seconds"
        env:
          XCODEBUILD_ARGS: "-destination '${{ env.TVOS_DESTINATION }}' ${{ env.XCODEBUILD_COMMON_FLAGS }} -derivedDataPath ${{ runner.temp }}/bitmovin-build"

      - name: Verify Google IMA package and framework state
        env:
          APP_PATH: ${{ runner.temp }}/bitmovin-build/Build/Products/Debug-appletvsimulator/BitmovinPlayerReactNativeExample.app
        run: |
          for framework in BitmovinPlayer BitmovinPlayerCore BitmovinPlayerAnalytics BitmovinCollector; do
            binary="$APP_PATH/Frameworks/$framework.framework/$framework"
            if [ ! -s "$binary" ]; then
              echo "::error::Missing embedded SDK binary: $binary"
              exit 1
            fi
          done
          PROJECT_FILE=example/ios/BitmovinPlayerReactNativeExample.xcodeproj/project.pbxproj
          PACKAGE_RESOLVED=example/ios/BitmovinPlayerReactNativeExample.xcworkspace/xcshareddata/swiftpm/Package.resolved
          IMA_BINARY="$APP_PATH/Frameworks/GoogleInteractiveMediaAds.framework/GoogleInteractiveMediaAds"
          if [ "${{ matrix.google-ima }}" = "true" ]; then
            if ! grep -q 'GoogleInteractiveMediaAdsTvOS' "$PROJECT_FILE" || [ ! -s "$IMA_BINARY" ]; then
              echo "::error::Missing Google IMA package or framework from the enabled tvOS app"
              exit 1
            fi
          else
            for file in "$PROJECT_FILE" "$PACKAGE_RESOLVED"; do
              if [ -f "$file" ] && grep -q -E 'swift-package-manager-google-interactive-media-ads|GoogleInteractiveMediaAdsTvOS' "$file"; then
                echo "::error::Unexpected Google IMA package reference in $file"
                exit 1
              fi
            done
            if [ -e "$APP_PATH/Frameworks/GoogleInteractiveMediaAds.framework" ]; then
              echo "::error::Unexpected Google IMA framework in the disabled tvOS app"
              exit 1
            fi
          fi

  example-archive:
    if: github.event_name != 'workflow_dispatch'
    name: Archive ${{ matrix.platform }} (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '["iOS"]' || '["iOS", "tvOS"]') }}
        configuration: ${{ fromJSON(github.event_name == 'pull_request' && '["Release"]' || '["Debug", "Release"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          subprojects: true
          ios: true
          skip-prebuild: true
      - name: Build library and configure example
        run: |
          yarn build
          if [ '${{ matrix.platform }}' = tvOS ]; then
            yarn example prebuild:tv --platform ios --no-install
          else
            yarn example prebuild --platform ios --no-install
          fi
          yarn example pods
      - name: Archive unsigned device app
        env:
          SKIP_BUNDLING: '1'
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace example/ios/BitmovinPlayerReactNativeExample.xcworkspace \
            -scheme BitmovinPlayerReactNativeExample \
            -configuration '${{ matrix.configuration }}' \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -archivePath '${{ runner.temp }}/Example.xcarchive' \
            -derivedDataPath '${{ runner.temp }}/archive-build' \
            CODE_SIGNING_ALLOWED=NO | tee '${{ runner.temp }}/archive.log' | xcbeautify --renderer github-actions
      - name: Verify archived frameworks and signatures
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/Example.xcarchive
        run: |
          app="$ARCHIVE_PATH/Products/Applications/BitmovinPlayerReactNativeExample.app"
          for framework in BitmovinPlayer BitmovinPlayerCore BitmovinPlayerAnalytics BitmovinCollector GoogleInteractiveMediaAds; do
            test -s "$app/Frameworks/$framework.framework/$framework"
          done
          platform=ios
          if [ '${{ matrix.platform }}' = tvOS ]; then platform=tvos; fi
          for framework in BitmovinPlayer BitmovinPlayerCore BitmovinPlayerAnalytics BitmovinCollector CoreCollector GoogleInteractiveMediaAds; do
            test -s "$ARCHIVE_PATH/Signatures/$framework.xcframework-$platform.signature"
          done
          duplicates=$(find "$ARCHIVE_PATH/Signatures" -type f -name '*.signature' -exec basename {} \; | sort | uniq -d)
          test -z "$duplicates"
      - name: Save archive diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/Example.xcarchive/Signatures
