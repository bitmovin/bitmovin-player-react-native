import groovy.json.JsonSlurper

buildscript {
    // Buildscript is evaluated before everything else so we can't use getExtOrDefault
    def ktlint_version = rootProject.ext.has("ktlintVersion") ? rootProject.ext.get("ktlintVersion") : project.properties["BitmovinPlayerReactNative_ktlintVersion"]
    def android_plugin_version = rootProject.ext.has("androidPluginVersion") ? rootProject.ext.get("androidPluginVersion") : project.properties["BitmovinPlayerReactNative_androidPluginVersion"]

    repositories {
        google()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin_version"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:$ktlint_version"
    }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jlleitschuh.gradle.ktlint'

// Read version from package.json
def packageJsonFile = new File("$rootDir/../package.json")
def packageJson = new JsonSlurper().parseText(packageJsonFile.text)
def packageVersion = packageJson.version
def googleImaProperty = (findProperty("BITMOVIN_ENABLE_GOOGLE_IMA") ?: "false").toString()
def googleImaValue = googleImaProperty.trim().toLowerCase()
if (!["true", "false"].contains(googleImaValue)) {
    throw new GradleException("BITMOVIN_ENABLE_GOOGLE_IMA must be true or false, but was '" + googleImaProperty + "'.")
}
def googleImaEnabled = googleImaValue == "true"

group = 'com.bitmovin.player.reactnative'
version = packageVersion

android {
  namespace "com.bitmovin.player.reactnative"

  defaultConfig {
    versionCode 1
    versionName packageVersion
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  buildFeatures {
    buildConfig true
  }
}

repositories {
  google()
  mavenCentral()
  maven {
    url "https://artifacts.bitmovin.com/artifactory/public-releases"
  }
}

dependencies {
  // React Native (needed for hybrid bridge modules)
  //noinspection GradleDynamicVersion
  implementation 'com.facebook.react:react-native:+' // From node_modules

  implementation "androidx.concurrent:concurrent-futures:1.1.0"
  implementation "androidx.concurrent:concurrent-futures-ktx:1.1.0"

  compileOnly 'com.google.ads.interactivemedia.v3:interactivemedia:3.38.0'
  if (googleImaEnabled) {
    implementation 'com.google.ads.interactivemedia.v3:interactivemedia:3.38.0'
  }

  // Bitmovin
  implementation 'com.bitmovin.player:player:3.174.0+jason'
  implementation 'com.bitmovin.player:player-media-session:3.174.0+jason'
  // force okhttp-urlconnection to match the okhttp version pulled in by the player to avoid version conflicts
  implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.5.0'
}
